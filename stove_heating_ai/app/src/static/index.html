<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stove Heating AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Raleway", -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #f9fafb;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      max-width: 1024px;
      width: 90%;
      margin: 10px;
    }

    h1 {
      font-size: 1.8rem;
      color: #333333;
      margin-bottom: 20px;
      text-align: center;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      background-color: #f9fafb;
    }

    .status {
      font-size: 1.1rem;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-weight: 600;
      text-align: center;
    }

    .status.success {
      background-color: #d1fae5;
      color: #065f46;
    }

    .status.error {
      background-color: #fee2e2;
      color: #991b1b;
    }

    .status.running {
      background-color: #bfdbfe;
      color: #1e3a8a;
    }

    .status.idle {
      background-color: #f3f4f6;
      color: #4b5563;
    }

    button {
      background-color: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
      width: 100%;
      margin-top: 10px;
    }

    button:hover {
      background-color: #2563eb;
      transform: translateY(-2px);
    }

    button:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.9rem;
      color: #6b7280;
    }

    footer a {
      color: #3b82f6;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.9rem;
      color: #4b5563;
      margin-bottom: 5px;
    }

    .form-group input {
      padding: 8px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 1rem;
    }

    .prediction-result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 8px;
      background-color: #f0fdf4;
      color: #166534;
      font-weight: 600;
      text-align: center;
    }

    @media (min-width: 768px) {
      .form-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      button {
        width: auto;
      }
    }

    @media (min-width: 1024px) {
      .form-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Stove Heating AI</h1>

    <div class="card">
      <h2 style="font-size: 1.4rem; margin-bottom: 15px">Training Control</h2>
      <button id="trainButton" onclick="startTraining()">Start Training</button>
      <div id="trainingStatus" class="status idle">Current Status: Idle</div>
    </div>

    <div class="card">
      <h2 style="font-size: 1.4rem; margin-bottom: 15px">Prediction</h2>
      <form id="predictionForm" onsubmit="makePrediction(event)">
        <div class="form-grid">
          <div class="form-group">
            <label for="setpoint_temperature">Setpoint Temperature (°C)</label>
            <input type="number" step="0.1" id="setpoint_temperature" required />
          </div>
          <div class="form-group">
            <label for="avg_temperature">Average Temperature (°C)</label>
            <input type="number" step="0.1" id="avg_temperature" required />
          </div>
          <div class="form-group">
            <label for="living_room_humidity">Living Room Humidity (%)</label>
            <input type="number" step="0.1" id="living_room_humidity" required />
          </div>
          <div class="form-group">
            <label for="living_room_temperature">Living Room Temperature (°C)</label>
            <input type="number" step="0.1" id="living_room_temperature" required />
          </div>
          <div class="form-group">
            <label for="outdoor_temperature">Outdoor Temperature (°C)</label>
            <input type="number" step="0.1" id="outdoor_temperature" required />
          </div>
          <div class="form-group">
            <label for="stove_set_power">Stove Set Power (%)</label>
            <input type="number" step="1" min="0" max="100" id="stove_set_power" required />
          </div>
          <div class="form-group">
            <label for="stove_actual_power">Stove Actual Power (%)</label>
            <input type="number" step="1" min="0" max="100" id="stove_actual_power" required />
          </div>
          <div class="form-group">
            <label for="time_since_on">Time Since On (minutes)</label>
            <input type="number" step="1" min="0" id="time_since_on" required />
          </div>
        </div>
        <button type="submit">Make Prediction</button>
      </form>
      <div id="predictionResult" class="prediction-result" style="display: none;"></div>
    </div>

    <footer>
      Made with <span style="color: red">&hearts;</span> by sibest19. Check <a href="https://github.com/sibest19"
        target="_blank">GitHub</a> for more.
    </footer>
  </div>

  <script>
    let isPolling = false;
    const statusElement = document.getElementById("trainingStatus");
    const trainButton = document.getElementById("trainButton");
    const predictionForm = document.getElementById("predictionForm");
    const predictionResult = document.getElementById("predictionResult");

    async function startTraining() {
      try {
        trainButton.disabled = true;
        console.log("Training started...");
        const response = await fetch("./train", {
          method: "POST",
        });
        const data = await response.json();
        updateStatus(data);
        if (!isPolling) {
          pollStatus();
        }
      } catch (error) {
        console.error("Error starting training:", error);
        updateStatus({
          status: "error",
          message: "Failed to start training: " + error.message,
        });
        trainButton.disabled = false;
      }
    }

    async function pollStatus() {
      isPolling = true;
      console.log("Started polling for training status...");
      while (isPolling) {
        try {
          const response = await fetch("./status");
          const data = await response.json();
          updateStatus(data);

          if (data.status === "idle" || data.status === "error") {
            isPolling = false;
            trainButton.disabled = false;
          }
        } catch (error) {
          console.error("Error polling status:", error);
          isPolling = false;
          trainButton.disabled = false;
        }

        if (isPolling) {
          await new Promise((resolve) => setTimeout(resolve, 5000)); // Poll every 5 seconds
        }
      }
    }

    function updateStatus(data) {
      statusElement.className = "status " + data.status;
      statusElement.textContent = `Status: ${data.status} - ${data.message}`;
    }

    async function makePrediction(event) {
      event.preventDefault();

      const formData = {
        setpoint_temperature: parseFloat(document.getElementById("setpoint_temperature").value),
        avg_temperature: parseFloat(document.getElementById("avg_temperature").value),
        living_room_humidity: parseFloat(document.getElementById("living_room_humidity").value),
        living_room_temperature: parseFloat(document.getElementById("living_room_temperature").value),
        outdoor_temperature: parseFloat(document.getElementById("outdoor_temperature").value),
        stove_set_power: parseFloat(document.getElementById("stove_set_power").value),
        stove_actual_power: parseFloat(document.getElementById("stove_actual_power").value),
        time_since_on: parseFloat(document.getElementById("time_since_on").value),
      };

      try {
        console.log("Making prediction with data:", formData);
        const response = await fetch("./predict", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(formData),
        });

        const data = await response.json();

        if (data.status === "success") {
          predictionResult.style.display = "block";
          predictionResult.style.backgroundColor = "#f0fdf4";
          predictionResult.style.color = "#166534";
          predictionResult.textContent = `Predicted time to reach comfort temperature: ${Math.round(data.predicted_minutes)} minutes`;
        } else {
          predictionResult.style.display = "block";
          predictionResult.style.backgroundColor = "#fee2e2";
          predictionResult.style.color = "#991b1b";
          predictionResult.textContent = `Error: ${data.message}`;
        }
      } catch (error) {
        predictionResult.style.display = "block";
        predictionResult.style.backgroundColor = "#fee2e2";
        predictionResult.style.color = "#991b1b";
        predictionResult.textContent = `Error making prediction: ${error.message}`;
      }
    }

    // Initial status check
    pollStatus();
  </script>
</body>

</html>
